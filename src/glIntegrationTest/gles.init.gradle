import org.gradle.api.tasks.SourceSetContainer
import org.gradle.api.tasks.compile.JavaCompile
import org.gradle.api.tasks.testing.Test

gradle.rootProject { root ->
    root.afterEvaluate {
        def sourceSets = root.extensions.getByType(SourceSetContainer)
        def desktop = sourceSets.getByName('glIntegrationTest')
        def gles = sourceSets.create('glesIntegrationTest') {
            java.setSrcDirs(['src/glIntegrationTest/gles'])
            runtimeClasspath += desktop.output
        }
        root.configurations.named(gles.implementationConfigurationName) {
            extendsFrom(root.configurations.getByName(desktop.implementationConfigurationName))
        }
        root.configurations.named(gles.compileOnlyConfigurationName) {
            extendsFrom(root.configurations.getByName(desktop.compileOnlyConfigurationName))
        }
        root.configurations.named(gles.runtimeOnlyConfigurationName) {
            extendsFrom(root.configurations.getByName(desktop.runtimeOnlyConfigurationName))
        }
        root.dependencies.add(gles.implementationConfigurationName, root.project(':glsm'))
        def lwjglVersion = root.ext.lwjglVersion
        def natives = root.ext.lwjglNativesClassifier
        root.dependencies.add(gles.implementationConfigurationName, "org.lwjgl:lwjgl-opengles:${lwjglVersion}")
        if (natives != null) {
            root.dependencies.add(gles.runtimeOnlyConfigurationName, "org.lwjgl:lwjgl-opengles:${lwjglVersion}:${natives}")
            root.dependencies.add(gles.runtimeOnlyConfigurationName, "org.lwjgl:lwjgl-spvc:${lwjglVersion}:${natives}")
        }

        root.tasks.named(gles.compileJavaTaskName, JavaCompile) {
            options.encoding = 'UTF-8'
            options.release.set(21)
        }
        def desktopTask = root.tasks.named('glIntegrationTest', Test)
        def eglDir = root.providers.gradleProperty('glesEglDir')
        root.tasks.register('glesIntegrationTest', Test) {
            group = 'verification'
            description = 'Runs the native SDL OpenGL ES 3.2 integration tests.'
            dependsOn root.tasks.named('validateGlIntegrationPlatform')
            testClassesDirs = gles.output.classesDirs
            classpath = gles.runtimeClasspath.filter { !it.name.startsWith('lwjglx-') }
            useJUnitPlatform()
            systemProperty 'junit.platform.launcher.interceptors.enabled', 'true'
            javaLauncher.set(desktopTask.flatMap { it.javaLauncher })
            maxParallelForks = 1
            forkEvery = 1
            jvmArgs '--enable-native-access=ALL-UNNAMED'
            environment 'SDL_VIDEO_FORCE_EGL', '1'
            if (eglDir.isPresent()) {
                def dir = root.file(eglDir.get())
                def egl = new File(dir, 'libEGL.dll')
                def glesLibrary = new File(dir, 'libGLESv2.dll')
                inputs.files(egl, glesLibrary)
                environment 'SDL_EGL_LIBRARY', egl.absolutePath
                environment 'SDL_OPENGL_LIBRARY', glesLibrary.absolutePath
                environment 'PATH', dir.absolutePath + File.pathSeparator + System.getenv('PATH')
                doFirst {
                    if (!egl.isFile() || !glesLibrary.isFile()) {
                        throw new GradleException("glesEglDir must contain libEGL.dll and libGLESv2.dll: ${dir}")
                    }
                }
            }
            // Drivers and the selected GPU can change independently of the build inputs.
            outputs.upToDateWhen { false }
            testLogging.showStandardStreams = true
        }
    }
}
