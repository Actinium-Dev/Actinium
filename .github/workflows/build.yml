name: Build mod jar

on: push

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        # Full history + tags: the build derives the version prefix from the nearest git tag
        # (git describe), which fails on the default shallow checkout and silently falls back
        # to gradle.properties mod_version.
        fetch-depth: 0
    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
    - uses: gradle/actions/setup-gradle@v6
      with:
        gradle-version: 9.7.1
      name: Set up Gradle
    - name: Add permission
      run: chmod +x ./gradlew
    - name: Execute Gradle build
      run: ./gradlew build

    - name: Upload Actinium JAR
      uses: actions/upload-artifact@v7
      with:
        path: |
          build/libs/Actinium-*.jar
          !build/libs/Actinium-*-thin.jar
          !build/libs/Actinium-*-sources.jar
          !build/libs/Actinium-*-javadoc.jar
        archive: false
        if-no-files-found: error
    - name: Upload thin JAR
      uses: actions/upload-artifact@v7
      with:
        path: build/libs/Actinium-*-thin.jar
        archive: false
        if-no-files-found: error
    - name: Upload sources JAR
      uses: actions/upload-artifact@v7
      with:
        path: build/libs/Actinium-*-sources.jar
        archive: false
        if-no-files-found: error
    - name: Upload Javadoc JAR
      if: ${{ hashFiles('build/libs/Actinium-*-javadoc.jar') != '' }}
      uses: actions/upload-artifact@v7
      with:
        path: build/libs/Actinium-*-javadoc.jar
        archive: false
        if-no-files-found: error
    - name: Upload MoltenVK JAR
      uses: actions/upload-artifact@v7
      with:
        path: build/libs/actinium-moltenvk-*.jar
        archive: false
        if-no-files-found: error
