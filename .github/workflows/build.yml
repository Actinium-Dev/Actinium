name: Build mod jar

on:
  workflow_dispatch:
  push:
  # Pull requests need an explicit trigger: pushes to a fork never reach this
  # repository, so without it a contribution gets no build at all.
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        # Full history + tags: the build derives the version prefix from the nearest git tag
        # (git describe), which fails on the default shallow checkout and silently falls back
        # to gradle.properties mod_version.
        fetch-depth: 0
    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
    - uses: gradle/actions/setup-gradle@v6
      with:
        gradle-version: 9.7.1
      name: Set up Gradle
    - name: Add permission
      run: chmod +x ./gradlew
    - name: Execute Gradle build
      run: ./gradlew build

    - name: Install EGL and software rendering dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libegl-mesa0 libgles2 libgl1-mesa-dri xvfb xauth
    - name: Run native OpenGL ES 3.2 integration tests
      env:
        LIBGL_ALWAYS_SOFTWARE: '1'
        SDL_VIDEO_DRIVER: x11
      run: xvfb-run -a ./gradlew -I src/glIntegrationTest/gles.init.gradle glesIntegrationTest
        
    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v7
      with:
        path: build/libs
